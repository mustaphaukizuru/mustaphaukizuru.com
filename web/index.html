<!doctype html>

    <meta charset="UTF-8" />

    <!-- iOS auto-linking opt-out · phone numbers in copy stay non-tappable
         unless we explicitly mark them up as <a href="tel:...">. Prevents
         Safari from styling random number sequences (years, prices) as links. -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light" />

    <!-- ────────────────────────────────────────────────────────────────
         T3-2 · pre-paint the stored theme.

         useTheme applies data-theme in a useEffect, which runs after the
         first paint — so a dashboard user who chose dark got a full white
         frame on every reload before the page repainted. This is the only
         fix for that: it has to be BLOCKING, in the head, before any
         stylesheet resolves.

         Deliberately tiny and deliberately duplicated from ThemeSwitcher's
         readStored(): the two agree on the key ("theme"), the valid values,
         and the rule that anything other than an explicit "dark" resolves
         to light (Brand v3.1 §00). A test asserts they stay in step.

         try/catch because localStorage throws outright in a locked-down
         browser, and a theme preference is not worth a blank page.
         ──────────────────────────────────────────────────────────────── -->
    <script>
      (function () {
        try {
          var t = window.localStorage.getItem("theme");
          var effective = t === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", effective);
          document.documentElement.style.colorScheme = effective;
        } catch (e) { /* private mode, blocked storage — light is the default anyway */ }
      })();
    </script>

    <!-- ────────────────────────────────────────────────────────────────
         SEO04 · Search-engine verification meta tags
         Tokens are substituted at build time from VITE_GOOGLE_VERIFY /
         VITE_BING_VERIFY / VITE_YANDEX_VERIFY / VITE_PINTEREST_VERIFY env
         vars (see vite.config.js · seoVerificationReplacePlugin). When a
         var is unset the line is stripped from the HTML entirely, so
         production never ships placeholder strings. DNS TXT verification
         is preferred for Google (see SEARCH-CONSOLE-SETUP.md) but the meta
         is kept as a fallback when DNS access is restricted.
         ──────────────────────────────────────────────────────────────── -->
    <meta name="google-site-verification" content="__GOOGLE_VERIFY__" />
    <meta name="msvalidate.01"            content="__BING_VERIFY__" />
    <meta name="yandex-verification"      content="__YANDEX_VERIFY__" />
    <meta name="p:domain_verify"          content="__PINTEREST_VERIFY__" />

    <!-- F02 · Brand identity — favicon set + manifest, single source of truth.
         The SVG favicon is the master (always crisp); PNG fallbacks cover
         legacy Windows/Android contexts; the .ico stays for IE/Safari pinned. -->
    <link rel="icon"          type="image/svg+xml"  href="/favicon.svg" />
    <link rel="icon"          type="image/png"      sizes="96x96"  href="/favicon-96x96.png" />
    <link rel="icon"          type="image/png"      sizes="192x192" href="/web-app-manifest-192x192.png" />
    <link rel="icon"          type="image/png"      sizes="512x512" href="/web-app-manifest-512x512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180"    href="/apple-touch-icon.png" />
    <link rel="mask-icon"        href="/favicon.svg" color="#5D3FD3" />
    <link rel="manifest"         href="/site.webmanifest" />

    <!-- iOS / Android PWA polish — keeps the brand violet under status-bar tint.
         Chrome deprecated `apple-mobile-web-app-capable` and now expects the
         vendor-neutral `mobile-web-app-capable`. We ship both for backwards
         compatibility with older iOS Safari which still reads the apple- form. -->
    <meta name="mobile-web-app-capable"                 content="yes" />
    <meta name="apple-mobile-web-app-capable"           content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style"  content="black-translucent" />
    <meta name="apple-mobile-web-app-title"             content="Ukizuru" />
    <meta name="application-name"                       content="Ukizuru" />
    <meta name="msapplication-TileColor"                content="#5D3FD3" />
    <meta name="msapplication-TileImage"                content="/web-app-manifest-192x192.png" />

    <!-- F03 · Self-hosted variable fonts (preload for instant LCP) -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Sora-Variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/JetBrainsMono-Variable.woff2" crossorigin />

    <!-- SEO04 · GA preconnect — shaves ~80ms off the first gtag request.
         Safe even when GA ID isn't set (browsers ignore unused preconnects). -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="preconnect" href="https://www.google-analytics.com" crossorigin />

    <!-- CWV · Payment gateway DNS prefetch + preconnect. Visitors who reach
         /checkout pay a ~80-150ms DNS-lookup tax on first PayPal / MP load.
         Prefetching the DNS in the document head amortises that cost across
         navigation time. dns-prefetch is the cheap fallback for older
         browsers; preconnect upgrades modern browsers to a full TCP+TLS
         warm-up. Safe-by-design — no payment script loads until checkout. -->
    <link rel="dns-prefetch" href="https://www.paypal.com" />
    <link rel="dns-prefetch" href="https://www.paypalobjects.com" />
    <link rel="dns-prefetch" href="https://api-m.paypal.com" />
    <link rel="dns-prefetch" href="https://www.mercadopago.com" />
    <link rel="dns-prefetch" href="https://sdk.mercadopago.com" />
    <link rel="dns-prefetch" href="https://api.mercadopago.com" />
    <link rel="dns-prefetch" href="https://accounts.google.com" />

    <!-- ────────────────────────────────────────────────────────────────
         SEO04 · GA4 gtag.js — bootstrap REMOVED, now consent-gated
         GA4 used to auto-load here from VITE_GA_MEASUREMENT_ID on every
         page boot. That violated GDPR / ePrivacy because the script
         ran (and gtag pings fired) BEFORE the user had a chance to
         accept the analytics category on the cookie banner.
         The loader now lives in web/src/lib/analytics.js and only
         injects gtag.js after `setAnalyticsConsent(true)` is called by
         CookieConsentContext — i.e. ONLY when the user has explicitly
         opted in. A "Reject all" click means zero bytes to Google.
         ──────────────────────────────────────────────────────────── -->
  </head>
  <body>
    <!-- ============================================================
         BOOT SPLASH · inline, so the browser has something to paint
         before any JavaScript exists.
         ============================================================
         Measured under Lighthouse-mobile throttling (4x CPU, slow 4G),
         FCP was 4.10-4.22s on EVERY page — flat across /, /about,
         /services, /store and /contact, which is the signature of a
         bundle-gated paint rather than page content. The body was
         `<div id="root"></div>` and nothing else, and main.jsx waits on
         `i18nReady` (a dynamic locale import) before it even calls
         render() — so ~338 KB of gzipped JS had to arrive, parse and
         execute before the first pixel.
         On two of those pages the largest-contentful-paint ELEMENT was
         the React splash's own tagline, which tells the same story.

         This markup lives INSIDE #root on purpose: React's
         createRoot().render() replaces the container's children, so the
         splash is removed at exactly the moment the app paints — no
         cleanup code, no timer, no flash of two splashes.

         Everything here is inline and self-contained: no external CSS,
         no web font, no image request. It cannot add a round-trip to
         the path it exists to shorten. -->
    <div id="root">
      <div id="boot" role="status" aria-label="Loading mustaphaukizuru.com">
        <div class="boot-card">
          <svg class="boot-mark" viewBox="0 0 52 52" aria-hidden="true">
            <rect width="52" height="52" rx="14" fill="#5D3FD3" />
            <rect x="36" y="6" width="9" height="9" rx="2" fill="#E9C46A" />
            <text x="26" y="34" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
                  font-weight="800" font-size="22" fill="#F8FAFC" letter-spacing="-0.02em">MU</text>
          </svg>
          <p class="boot-name">Mustapha Ukizuru</p>
          <p class="boot-tag">Technology Consulting</p>
          <div class="boot-bar"><i></i></div>
        </div>
      </div>
    </div>
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #4A2EAB;
        background-image:
          radial-gradient(ellipse 70% 60% at 20% 20%, rgba(93,63,211,.75), transparent 60%),
          radial-gradient(ellipse 60% 60% at 85% 80%, rgba(139,111,232,.35), transparent 60%);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .boot-card { text-align: center; padding: 24px; }
      .boot-mark { width: 56px; height: 56px; display: block; margin: 0 auto 18px; }
      .boot-name { margin: 0; color: #F8FAFC; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
      .boot-tag  { margin: 6px 0 0; color: rgba(248,250,252,.72); font-size: 12px; font-weight: 600;
                   text-transform: uppercase; letter-spacing: .18em; }
      .boot-bar  { width: 168px; height: 3px; margin: 22px auto 0; border-radius: 999px;
                   background: rgba(248,250,252,.14); overflow: hidden; }
      .boot-bar > i { display: block; width: 40%; height: 100%; border-radius: 999px;
                      background: linear-gradient(90deg, #E9C46A, #F8FAFC, #7DD3FC);
                      animation: boot-slide 1.15s ease-in-out infinite; }
      @keyframes boot-slide { 0% { transform: translateX(-110%) } 100% { transform: translateX(360%) } }
      /* A visitor who asked for less motion gets a static bar, not a
         crawling one. The splash still communicates "loading" through the
         label and the copy. */
      @media (prefers-reduced-motion: reduce) {
        .boot-bar > i { animation: none; width: 100%; opacity: .5 }
      }
    </style>
    <!--
      The Google Identity Services SDK is now lazy-loaded by GoogleLoginButton
      on mount (LoginPage / SignupPage only) instead of being downloaded on
      every page. Saves ~80 KB of script execution + network round-trip on
      every public page that doesn't use Google sign-in. See
      web/src/components/GoogleLoginButton.jsx · "lazy GSI loader" effect.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
