# ─────────────────────────────────────────────────────────────────────────────
# Uptime + database monitor
#
# WHY THIS EXISTS
# ---------------
# /api/v1/health has always reported `database: ok|down`. Nothing watched it.
# On 2026-08-25 production served static pages normally while every DB-backed
# route hung for 30 s — the site LOOKED alive, nobody could log in or check
# out, and it was found by opening the site by hand hours later.
#
# That failure is invisible to a naive "is the homepage up?" check, because
# Passenger serves public/ statically WITHOUT Node. So this checks two things
# that a homepage ping cannot:
#
#   1. the API answers at all (it hangs rather than erroring when the app
#      cannot spawn), and
#   2. the health payload actually says database: ok — a 200 with
#      "database":"down" is still an outage for every paying customer.
#
# A failed scheduled workflow emails the repo owner through GitHub's own
# notifications, so this needs no third-party monitoring account.
# ─────────────────────────────────────────────────────────────────────────────

name: Uptime

on:
  schedule:
    # Every 15 minutes. GitHub queues scheduled runs under load, so treat this
    # as "roughly every 15 minutes", not a guarantee.
    - cron: "*/15 * * * *"
    # Hourly: the authenticated deep probe (SMTP + gateways) and the cron
    # dead-man switch. Kept off the 15-minute cadence because deep opens
    # real provider connections on every call.
    - cron: "7 * * * *"
  workflow_dispatch: {}

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  probe:
    name: Probe production health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API health and database status
        env:
          BASE_URL: https://mustaphaukizuru.com
        run: |
          set -uo pipefail

          # --max-time is the whole point: the observed failure mode is a hang,
          # not an error status. Without a timeout this step would sit until the
          # job times out and report far less clearly.
          echo "Probing $BASE_URL/api/v1/health"
          body="$(curl -sS --max-time 25 -w '\n%{http_code}' "$BASE_URL/api/v1/health" || true)"

          code="$(printf '%s' "$body" | tail -n1)"
          payload="$(printf '%s' "$body" | sed '$d')"

          echo "HTTP: ${code:-<none>}"
          echo "Body: ${payload:-<empty>}"

          if [ -z "${code:-}" ] || [ "$code" = "000" ]; then
            echo "::error::API did not respond within 25s — the app is not being spawned. Static pages may still serve, so the site can look fine."
            exit 1
          fi

          if [ "$code" != "200" ]; then
            echo "::error::Health endpoint returned HTTP $code."
            exit 1
          fi

          # A 200 that reports the database as down is still a full outage for
          # anyone trying to browse products, sign in, or check out.
          case "$payload" in
            *'"database":"ok"'*)
              echo "Healthy: API responding and database reachable."
              ;;
            *)
              echo "::error::API responded 200 but the database is not ok. Payload above."
              exit 1
              ;;
          esac

          # scripts/prisma-generate.js leaves a marker when `prisma generate`
          # failed at install: the app is up but running on a client older
          # than its schema, and the next query touching a new column 500s.
          case "$payload" in
            *'"prismaGenerate":"stale"'*)
              echo "::error::prisma generate failed on the last install (prismaGenerate: stale). Run scripts/hostinger-recover.sh recover."
              exit 1
              ;;
          esac

      - name: Check the storefront still serves
        env:
          BASE_URL: https://mustaphaukizuru.com
        run: |
          set -uo pipefail
          code="$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "$BASE_URL/" || echo 000)"
          echo "Storefront HTTP: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Storefront returned $code — static serving is broken too, not just the app."
            exit 1
          fi

  # Hourly only (the second cron above, or a manual run).
  deep:
    name: Deep probe + cron dead-man switch
    if: github.event.schedule == '7 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # SMTP, Mercado Pago and PayPal, plus environment and version, behind
      # the shared header. Without the secret the step is skipped loudly
      # rather than reporting a false failure.
      - name: Deep health (SMTP + gateways)
        env:
          BASE_URL: https://mustaphaukizuru.com
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${HEALTH_TOKEN:-}" ]; then
            echo "::warning::HEALTH_TOKEN secret is not set — deep probe skipped. Add it to GitHub secrets and the host .env (T1-6)."
            exit 0
          fi
          body="$(curl -sS --max-time 25 -H "X-Health-Token: $HEALTH_TOKEN" -w '\n%{http_code}' "$BASE_URL/api/v1/health/deep" || true)"
          code="$(printf '%s' "$body" | tail -n1)"
          payload="$(printf '%s' "$body" | sed '$d')"
          echo "HTTP: ${code:-<none>}"
          echo "Body: ${payload:-<empty>}"
          if [ "${code:-000}" != "200" ]; then
            echo "::error::Deep health returned HTTP ${code:-none}. A dependency (database, SMTP, Mercado Pago, PayPal) is down or the token is wrong."
            exit 1
          fi

      # Every scheduled job writes a heartbeat after a successful pass.
      # /health/jobs answers 503 while any job is older than twice its
      # interval — a scheduler that silently stopped is now an alert.
      - name: Cron dead-man switch
        env:
          BASE_URL: https://mustaphaukizuru.com
        run: |
          set -uo pipefail
          body="$(curl -sS --max-time 25 -w '\n%{http_code}' "$BASE_URL/api/v1/health/jobs" || true)"
          code="$(printf '%s' "$body" | tail -n1)"
          payload="$(printf '%s' "$body" | sed '$d')"
          echo "HTTP: ${code:-<none>}"
          echo "Body: ${payload:-<empty>}"
          if [ "${code:-000}" != "200" ]; then
            echo "::error::One or more scheduled jobs have not completed within twice their interval. Payload above names them."
            exit 1
          fi
