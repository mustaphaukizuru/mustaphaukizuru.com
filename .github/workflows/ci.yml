# ──────────────────────────────────────────────────────────────────────────────
# mustaphaukizuru.com — Continuous Integration
# v2.1 · 2026-08-24 · backend tests · frontend lint + build · Lighthouse CI
#
# Gates:
#   - Backend: npm ci → prisma generate → audit gate (backend + web, moderate+)
#     → structure guard → jest WITH coverage (thresholds in package.json)
#   - Schema (pull requests): the base branch's schema is pushed to a MySQL
#     service container, then scripts/check-db-drift.js runs against the PR's
#     schema — a column the PR drops or renames is "drift" and fails the job,
#     which is the same check deploy.sh runs before `db push` on the host.
#   - Frontend: npm ci → gates → lint → i18n parity → build (emits to public/)
#   - E2E: Playwright drives the built SPA through store → cart → checkout →
#     success with the API stubbed at the network layer (web/e2e).
#   - Lighthouse: `lhci autorun` against the built public/ dir, desktop
#     (lighthouserc.json, perf ≥ 0.95) and mobile (lighthouserc.mobile.json,
#     perf ≥ 0.85). No secrets required — uses temporary-public-storage.
#
# Legacy v1 workflow preserved at .github/workflows/ci.yml.legacy-2026-05-10
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  # Manual re-trigger. Feature branches only get runs from the pull_request
  # event; during the 2026-08-26 GitHub Actions outage those events were
  # dropped and four consecutive pushes produced no run at all, with no way
  # to ask for one short of closing and reopening the PR. This gives
  # `gh workflow run ci.yml --ref <branch>` a target.
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Backend — install, generate Prisma client, run Jest suite
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (install + Prisma + Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Block only on `moderate` and above so noisy low-CVSS advisories don't
      # fail the build while the multer-1.x class of issue is still caught.
      # Blocks on moderate+ EXCEPT a short, written allow-list of advisories
      # judged unreachable here (see scripts/audit-gate.js and
      # docs/LAUNCH_HANDOVER_2026-08.md section 8). Plain
      # `npm audit --audit-level=moderate` fails on those permanently, and a
      # permanently red gate stops catching the advisories that do matter.
      # Q5: the gate audits web/ too. `npm audit` only needs the lockfile, so
      # no second install — the frontend job never looked at advisories at
      # all, which is how 24 advisories (13 high: react-router, vite, postcss,
      # nanoid) sat in the SPA's production deps unnoticed.
      - name: Audit dependencies (backend + web)
        run: node scripts/audit-gate.js

      # Duplicate-directory guard. Existed with zero callers.
      - name: Structure guard
        run: npm run lint:structure

      # Both sides of this merge reached the same conclusion independently:
      # `npm test` is bare jest, and jest only enforces coverageThreshold under
      # --coverage, so the 44/41/26/27 gate in package.json had never once been
      # evaluated in CI. It was decorative, and coverage could rot to zero
      # without turning the build red. Measured at the switch: statements
      # 56.9%, branches 41.9%, functions 48.2% — comfortably clear. This branch
      # additionally ratchets per-path thresholds over the money paths.
      - name: Run backend tests (with coverage gate)
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 7

      # T4-4 · the numbers behind the /about stat strip.
      #
      # Uploaded rather than committed, and the difference is ADR 0001: the
      # SPA bundle is committed rather than built on the server, so a file CI
      # writes into its own workspace never reaches a visitor. This is how the
      # owner refreshes the committed copy after a run whose numbers are worth
      # publishing — download it, drop it in public/, commit.
      #
      # The Lighthouse scores are absent here because the lighthouse job runs
      # later and separately; the generator omits what it cannot find, and the
      # strip hides a tile it has no number for.
      - name: Generate engineering stats
        if: always()
        run: node web/scripts/generate-engineering-stats.mjs

      - name: Upload engineering stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-stats
          path: web/public/engineering-stats.json
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Schema — drift gate on pull requests. Hostinger MySQL has no shadow DB and
  # the project uses `db push`, which silently DROPS anything the schema no
  # longer declares. This job pushes the BASE branch's schema to a throwaway
  # MySQL, then runs the same drift check deploy.sh runs, against the PR's
  # schema. Exit 2 = a table or column would be dropped = red.
  # ────────────────────────────────────────────────────────────────────────────
  schema:
    name: Schema (drift gate vs ${{ github.base_ref }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # 127.0.0.1 is on guard-prod-db.js's local allowlist, so every guarded
      # script treats this database as what it is: disposable.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma Client (PR schema)
        run: npx prisma generate

      - name: Push the base branch's schema
        run: |
          git show "origin/${{ github.base_ref }}:prisma/schema.prisma" > /tmp/base.prisma
          npx prisma db push --schema /tmp/base.prisma --skip-generate --accept-data-loss

      # Exit 2 on drift, by design (scripts/check-db-drift.js).
      - name: Drift check (base database vs PR schema)
        run: node scripts/check-db-drift.js

      - name: Push the PR schema
        run: npx prisma db push --skip-generate

      # Query plans on an empty database are not the production plans; this
      # is advisory until the seeded `real` lane (T3-4) gives it rows.
      - name: Explain hot queries (advisory)
        continue-on-error: true
        run: node scripts/explain-hot-queries.js

  # ────────────────────────────────────────────────────────────────────────────
  # Frontend — install + lint + production build (Vite)
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (install + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-bundle-fresh.sh compares commit ancestry.
          fetch-depth: 0

      # The bundle under public/ is committed (ADR 0001). A web/src change
      # whose last commit is newer than the bundle's last commit is a change
      # that will not ship — fail here, not in production.
      - name: Bundle freshness (public/ vs web/src)
        run: bash scripts/check-bundle-fresh.sh

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      # Roadmap step 22 — design-system lock. Fails when a raw hex, a brand
      # rgba() triple, or a literal font-family reappears in web/src outside
      # the documented allowlist. Runs BEFORE lint so a token regression is
      # reported even when ESLint is also failing.
      - name: Design tokens gate
        working-directory: web
        run: npm run lint:tokens

      # Roadmap step 22 (companion gate) — WCAG 2.1 AA contrast lock.
      # This was previously not wired into CI, which is exactly how a
      # text-mint-700/75 at 10.5px (3.86:1) reached the branch and failed the
      # Lighthouse job instead. Catching it here costs seconds; catching it
      # in Lighthouse costs a full browser run and a much vaguer error.
      - name: Contrast gate
        working-directory: web
        run: npm run lint:contrast

      # U4 — elevation-scale lock. The 249 arbitrary shadow values were
      # collapsed onto a 14-token scale (PR #55); the 173 deliberate one-offs
      # that remain are committed as a baseline. This fails only when a NEW
      # raw `shadow-[...]` value appears instead of a scale step.
      - name: Shadow ratchet
        working-directory: web
        run: npm run lint:shadows

      - name: Lint
        working-directory: web
        run: npm run lint

      # Locale key parity (en ↔ es) and the shared I18N flag polarity. Had
      # zero callers in CI.
      - name: i18n parity
        working-directory: web
        run: npm run test:i18n

      # T3-4 · the frontend unit lane. The Playwright job below answers every
      # request with page.route(), so it cannot see a bug in the code that
      # BUILDS a request: the CSRF header, the 401 teardown, the consent
      # record. Placed before the build so a broken context fails in seconds
      # instead of after a full bundle.
      - name: Unit tests (vitest)
        working-directory: web
        run: npm run test:unit

      # T2-10 · the generated catalogue references must match their source.
      # docs/catalogue/*.md and the downloadable catalogue are OUTPUTS of
      # web/src/data/servicesCatalogue.js. They were hand-written snapshots
      # whose own headers said "regenerate after any edit; do not hand-edit
      # prices here" — and nothing regenerated them, so a price change left
      # the documents that proposals are written from quoting the old figure.
      # Same shape as the bundle-freshness gate above: re-run the generator,
      # fail if the committed copy differs.
      - name: Catalogue drift
        working-directory: web
        run: npm run catalog:check

      # Raw fetch()/axios outside lib/api.js. Warns today (H-11); the step
      # exists so promoting it to an error is a one-line change.
      - name: API discipline
        run: bash scripts/check-api-discipline.sh

      - name: Build (production parity gate — MUST PASS)
        working-directory: web
        run: npm run build
        env:
          # Same-origin, deliberately. `.env*` is gitignored, so a CI checkout
          # has no env files at all and web/src/lib/api.js falls back to
          # "http://localhost:5000" — a port nothing listens on in these jobs.
          # Every API call in the artifact then failed with
          # ERR_CONNECTION_REFUSED, which cost us twice: Lighthouse scored
          # `errors-in-console` 0 on best-practices, and /about silently fell
          # back to aboutProjectsData (AboutPage.jsx:916) so CI audited a page
          # local runs never rendered. Empty means same-origin, which
          # scripts/lighthouse-server.js answers from its fixture — so CI and a
          # local `lhci autorun` finally look at the same page.
          # The deployed bundle is the committed public/, built from
          # web/.env.production; this only shapes the CI artifact.
          VITE_API_BASE_URL: ""

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          # Vite (web/vite.config.js · outDir: "../public") emits the bundle
          # into the repo-root `public/` dir so Express can serve it directly.
          path: public
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # E2E — Q2. Real browser through the money path against the production
  # build. No database: there is no dev DB to point at (.env is production),
  # so the suite answers every API call with page.route() and asserts the
  # requests the SPA makes and the screens it renders. See web/e2e/.
  # ────────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright — checkout funnel)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: public

      # Cache the browser download keyed on the Playwright version; the
      # install step is a no-op on a hit.
      - name: Resolve Playwright version
        id: playwright-version
        working-directory: web
        run: echo "version=$(node -p "require(@playwright/test/package.json).version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run E2E (Playwright boots vite preview on the artifact)
        working-directory: web
        run: npm run test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: web/test-results
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Lighthouse CI — desktop + mobile budgets against the built public/ dir
  # ────────────────────────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            config: lighthouserc.json
          - name: mobile
            config: lighthouserc.mobile.json
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: public

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI (${{ matrix.name }})
        run: lhci autorun --config=${{ matrix.config }}

      # include-hidden-files is REQUIRED here. upload-artifact@v4 skips hidden
      # paths by default, and `.lighthouseci` is a dotfile directory — so this
      # step has silently uploaded nothing since the v4 bump, logging only
      # "No files were found with the provided path". Every Lighthouse failure
      # since then has been undebuggable from CI: you get a score in the log
      # and no report saying which audit lost the points.
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-${{ matrix.name }}
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7
