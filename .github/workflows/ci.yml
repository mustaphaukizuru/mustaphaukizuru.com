# ──────────────────────────────────────────────────────────────────────────────
# mustaphaukizuru.com — Continuous Integration
# v2.1 · 2026-08-24 · backend tests · frontend lint + build · Lighthouse CI
#
# Gates:
#   - Backend: npm ci → prisma generate → npm audit (moderate+) → npm test
#   - Frontend: npm ci → npm run lint → npm run build (emits to repo-root public/)
#   - Lighthouse: `lhci autorun` against the built public/ dir, desktop
#     (lighthouserc.json, perf ≥ 0.95) and mobile (lighthouserc.mobile.json,
#     perf ≥ 0.85). No secrets required — uses temporary-public-storage.
#
# Legacy v1 workflow preserved at .github/workflows/ci.yml.legacy-2026-05-10
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Backend — install, generate Prisma client, run Jest suite
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (install + Prisma + Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Block only on `moderate` and above so noisy low-CVSS advisories don't
      # fail the build while the multer-1.x class of issue is still caught.
      - name: Audit backend dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run backend tests
        run: npm test
        env:
          NODE_ENV: test

  # ────────────────────────────────────────────────────────────────────────────
  # Frontend — install + lint + production build (Vite)
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (install + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      # Roadmap step 22 — design-system lock. Fails when a raw hex, a brand
      # rgba() triple, or a literal font-family reappears in web/src outside
      # the documented allowlist. Runs BEFORE lint so a token regression is
      # reported even when ESLint is also failing.
      - name: Design tokens gate
        working-directory: web
        run: npm run lint:tokens

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build (production parity gate — MUST PASS)
        working-directory: web
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          # Vite (web/vite.config.js · outDir: "../public") emits the bundle
          # into the repo-root `public/` dir so Express can serve it directly.
          path: public
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # Lighthouse CI — desktop + mobile budgets against the built public/ dir
  # ────────────────────────────────────────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            config: lighthouserc.json
          - name: mobile
            config: lighthouserc.mobile.json
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: public

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI (${{ matrix.name }})
        run: lhci autorun --config=${{ matrix.config }}

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-${{ matrix.name }}
          path: .lighthouseci
          retention-days: 7
