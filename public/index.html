    <!-- iOS auto-linking opt-out · phone numbers in copy stay non-tappable
         unless we explicitly mark them up as <a href="tel:...">. Prevents
         Safari from styling random number sequences (years, prices) as links. -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light" />
    <meta name="author" content="Mustapha Ukizuru" />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <link rel="alternate" type="application/rss+xml" title="MUSTAPHA UKIZURU Blog" href="/feed.xml" />
    <meta name="description" content="Technology consulting, digital products, website systems, school IT transformation, and STEM education solutions for businesses, professionals, and educational institutions." />

    <!-- ────────────────────────────────────────────────────────────────
         SEO04 · Search-engine verification meta tags
         Tokens are substituted at build time from VITE_GOOGLE_VERIFY /
         VITE_BING_VERIFY / VITE_YANDEX_VERIFY / VITE_PINTEREST_VERIFY env
         vars (see vite.config.js · seoVerificationReplacePlugin). When a
         var is unset the line is stripped from the HTML entirely, so
         production never ships placeholder strings. DNS TXT verification
         is preferred for Google (see SEARCH-CONSOLE-SETUP.md) but the meta
         is kept as a fallback when DNS access is restricted.
         ──────────────────────────────────────────────────────────────── -->
<!-- F02 · Brand identity — favicon set + manifest, single source of truth.
         The SVG favicon is the master (always crisp); PNG fallbacks cover
         legacy Windows/Android contexts; the .ico stays for IE/Safari pinned. -->
    <link rel="icon"          type="image/svg+xml"  href="/favicon.svg" />
    <link rel="icon"          type="image/png"      sizes="96x96"  href="/favicon-96x96.png" />
    <link rel="icon"          type="image/png"      sizes="192x192" href="/web-app-manifest-192x192.png" />
    <link rel="icon"          type="image/png"      sizes="512x512" href="/web-app-manifest-512x512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180"    href="/apple-touch-icon.png" />
    <link rel="mask-icon"        href="/favicon.svg" color="#5D3FD3" />
    <link rel="manifest"         href="/site.webmanifest" />

    <!-- iOS / Android PWA polish — keeps the brand violet under status-bar tint.
         Chrome deprecated `apple-mobile-web-app-capable` and now expects the
         vendor-neutral `mobile-web-app-capable`. We ship both for backwards
         compatibility with older iOS Safari which still reads the apple- form. -->
    <meta name="mobile-web-app-capable"                 content="yes" />
    <meta name="apple-mobile-web-app-capable"           content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style"  content="black-translucent" />
    <meta name="apple-mobile-web-app-title"             content="Ukizuru" />
    <meta name="application-name"                       content="Ukizuru" />
    <meta name="msapplication-TileColor"                content="#5D3FD3" />
    <meta name="msapplication-TileImage"                content="/web-app-manifest-192x192.png" />

    <!-- F03 · Self-hosted variable fonts (preload for instant LCP) -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Sora-Variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/JetBrainsMono-Variable.woff2" crossorigin />

    <!-- SEO04 · GA preconnect — shaves ~80ms off the first gtag request.
         Safe even when GA ID isn't set (browsers ignore unused preconnects). -->
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="preconnect" href="https://www.google-analytics.com" crossorigin />

    <!-- CWV · Payment gateway DNS prefetch + preconnect. Visitors who reach
         /checkout pay a ~80-150ms DNS-lookup tax on first PayPal / MP load.
         Prefetching the DNS in the document head amortises that cost across
         navigation time. dns-prefetch is the cheap fallback for older
         browsers; preconnect upgrades modern browsers to a full TCP+TLS
         warm-up. Safe-by-design — no payment script loads until checkout. -->
    <link rel="dns-prefetch" href="https://www.paypal.com" />
    <link rel="dns-prefetch" href="https://www.paypalobjects.com" />
    <link rel="dns-prefetch" href="https://api-m.paypal.com" />
    <link rel="dns-prefetch" href="https://www.mercadopago.com" />
    <link rel="dns-prefetch" href="https://sdk.mercadopago.com" />
    <link rel="dns-prefetch" href="https://api.mercadopago.com" />
    <link rel="dns-prefetch" href="https://accounts.google.com" />

    <!-- ────────────────────────────────────────────────────────────────
         SEO04 · GA4 gtag.js — bootstrap REMOVED, now consent-gated
         GA4 used to auto-load here from VITE_GA_MEASUREMENT_ID on every
         page boot. That violated GDPR / ePrivacy because the script
         ran (and gtag pings fired) BEFORE the user had a chance to
         accept the analytics category on the cookie banner.
         The loader now lives in web/src/lib/analytics.js and only
         injects gtag.js after `setAnalyticsConsent(true)` is called by
         CookieConsentContext — i.e. ONLY when the user has explicitly
         opted in. A "Reject all" click means zero bytes to Google.
         ──────────────────────────────────────────────────────────── -->
    <script type="module" crossorigin src="/assets/index-CEnbsxfQ.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/react-vendor-BhzkbE4T.js">
    <link rel="modulepreload" crossorigin href="/assets/vendor-CwD1uBoI.js">
    <link rel="modulepreload" crossorigin href="/assets/i18n-JEdqQ06F.js">
    <link rel="modulepreload" crossorigin href="/assets/router-DRmf-LjD.js">
    <link rel="modulepreload" crossorigin href="/assets/lucide-ZcYocIew.js">
    <link rel="stylesheet" crossorigin href="/assets/index-DL9gbrvK.css">
